[project]
name = "notify-switchboard"
version = "0.7.1"
description = "A pure notify proxy for Home Assistant."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14.2"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = [
  "PLR0913", # too many arguments - HA callback signatures are fixed by the core
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.notify_switchboard"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "PLR0913", "PLR0917", "PLR2004"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
show_error_codes = true
files = ["custom_components/notify_switchboard"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.notify_switchboard --cov-report=term-missing"

[tool.coverage.run]
source = ["custom_components.notify_switchboard"]
