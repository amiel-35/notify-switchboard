name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Pytest (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha-version: pinned
            pre: false
          - ha-version: dev
            pre: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dev dependencies
        run: pip install -r requirements_dev.txt

      - name: Install latest Home Assistant (dev matrix leg)
        if: matrix.pre
        run: pip install --pre --upgrade homeassistant

      - name: Run unit tests with coverage
        # The acceptance suite (tests/acceptance) is the executable specification of the
        # sprint in progress: it is red by design until that sprint lands, so it runs in
        # the non-blocking job below.
        run: pytest --ignore=tests/acceptance --cov=custom_components.notify_switchboard --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.ha-version }}
          path: coverage.xml

  acceptance:
    name: Acceptance spec (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r requirements_dev.txt
      - name: Run the sprint acceptance suite
        run: pytest tests/acceptance --no-cov -q
