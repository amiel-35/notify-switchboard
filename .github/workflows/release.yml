name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Zip the integration
        working-directory: custom_components/notify_switchboard
        run: zip -r ${{ github.workspace }}/notify_switchboard.zip . -x '.*'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: notify_switchboard.zip
          generate_release_notes: true
