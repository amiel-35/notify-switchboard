# Quality scale self-assessment for Notify Switchboard.
# Bronze is the target for Sprint 1 (the router). Silver/gold are not assessed
# yet; they will be added once the cards and voice adapters land.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration does not register any custom actions/services.
  appropriate-polling:
    status: exempt
    comment: iot_class is calculated; every entity is push-updated.
  brands:
    status: todo
    comment: Brand assets not yet submitted to home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: >-
      No custom services.yaml is shipped: the public surface is the legacy
      notify.switchboard[_<slug>] services, described by notify's own schema.
  docs-conditions:
    status: exempt
    comment: This integration does not have any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration does not have any triggers.
  entity-event-setup:
    status: done
    comment: >-
      Entities subscribe in async_added_to_hass and unsubscribe through
      async_on_remove; the switchboard's own listeners are cancelled on unload
      and on EVENT_HOMEASSISTANT_STOP.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: >-
      There is no external device or service to validate during setup; the
      config flow has nothing to test a connection against.
  test-before-setup:
    status: exempt
    comment: Same reasoning as test-before-configure.
  unique-config-entry: done
  # Bronze, added in Sprint 1
  diagnostics: done
  entity-translations:
    status: exempt
    comment: >-
      Entity names are fixed by docs/contract.md; only the router-added
      Companion labels are translated, through the common.* section.
  reauthentication-flow:
    status: exempt
    comment: There is nothing to authenticate against.
  parallel-updates:
    status: exempt
    comment: No entity polls or writes to a device.
