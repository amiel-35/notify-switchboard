# UI services (contract v0.2 addendum, ADR-0016). Names and descriptions live
# in strings.json / translations/*.json under the `services` key, the way core
# integrations document theirs (script/hassfest/services.py).
acknowledge:
  fields:
    target:
      required: true
      example: leak
      selector:
        text:

snooze:
  fields:
    target:
      required: true
      example: leak
      selector:
        text:
    minutes:
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min
    person:
      example: person.alice
      selector:
        entity:
          filter:
            domain: person

unsnooze:
  fields:
    target:
      required: true
      example: leak
      selector:
        text:
    person:
      example: person.alice
      selector:
        entity:
          filter:
            domain: person

silence:
  fields:
    person:
      required: true
      example: person.alice
      selector:
        entity:
          filter:
            domain: person
    minutes:
      required: true
      example: 60
      selector:
        number:
          min: 1
          max: 1440
          step: 1
          mode: box
          unit_of_measurement: min

unsilence:
  fields:
    person:
      required: true
      example: person.alice
      selector:
        entity:
          filter:
            domain: person

# `notify_switchboard.explain` (contract v0.4 addendum, ADR-0018 §1) is
# deliberately **not** declared here, and this is a documented conflict rather
# than an oversight: `tests/acceptance/test_s2_services.py::
# test_services_yaml_declares_all_five_services_with_their_fields` is a frozen
# acceptance test that asserts this file declares exactly the five services of
# v0.2, and the coding agent may not modify it. The service is still fully
# usable -- it is registered with `SupportsResponse.ONLY` in `services.py`, it
# appears in Developer tools > Actions, and its name, description and field
# descriptions are translated through the `services.explain` block of
# `strings.json` and `translations/{en,fr,es}.json`. What it does not get until
# that test is amended is the generated field editor. See
# `docs/known-issues.md`.
